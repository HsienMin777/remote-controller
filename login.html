<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - AI 面試模擬終端</title>
    <style>
        /* 共用你的深色科技感配色 */
        :root {
            --bg-page: #05050a;
            --bg-card: rgba(15, 20, 30, 0.6);
            --border: rgba(14, 165, 233, 0.2);
            --text-main: #f8fafc;
            --text-muted: #8ba3cb;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border: 2px solid var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .toggle-link {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 24px;
            cursor: pointer;
            display: block;
        }

        .toggle-link:hover {
            color: var(--text-main);
        }

        #authError {
            color: #ef4444;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="logo-icon">I</div>
        <h2 id="formTitle" style="margin-top: 0;">登入系統</h2>
        <p id="formSubtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">存取您的 AI 面試分析資料庫</p>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" class="input-field" required placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" class="input-field" required placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="btn">登入</button>
            <div id="authError"></div>
        </form>

        <span class="toggle-link" id="toggleMode" onclick="toggleAuthMode()">還沒有帳號？點此註冊</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>
</body>

</html>

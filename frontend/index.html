<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <script src="./js/theme-init.js"></script>
    <!-- 🛡️ Auth Guard：Supabase SDK + auth.js + auth-guard.js 必須提早在 <head> 載入，
         才能在畫面畫出來之前就完成登入狀態判斷 (anti-FOUC)，順序不可調換 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/auth-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - AI 面試模擬終端</title>
    <style>
        /* 🌟 Clean B2B / Fintech 風格（參考 Stripe / Notion 質感） */
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-input: #F8FAFC;
            --border: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #475569;
            --accent: #1E3A8A;
            --accent-hover: #1E40AF;
            --accent-glow: rgba(30, 58, 138, 0.14);
            --danger: #DC2626;
            --radius-lg: 1.25rem;
            --radius-md: 0.75rem;
            --card-shadow: 0 20px 60px -15px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        /* 🌙 暗色模式：由 theme-init.js 在 <html> 加上 .dark class 觸發 */
        :root.dark {
            /* 🌑 現代科技黑：主要背景改成純黑／深黑灰色系，取代原本偏藍的深 slate 色階，
               強調色（--accent 藍）保留，作為按鈕／連結／互動元素的少量亮色點綴 */
            --bg-page: #0A0A0A;
            --bg-card: #141414;
            --bg-input: #1A1A1A;
            --border: #262626;
            --text-main: #FAFAFA;
            --text-muted: #A3A3A3;
            --accent: #3B82F6;
            --accent-hover: #60A5FA;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --danger: #F87171;
            --card-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🌟 首頁導覽列：不管有沒有登入都會顯示，右側按鈕依登入狀態動態切換
           （登入/註冊 ↔ 進入控制台），由 window.authGuardReady 決定要顯示哪一個 */
        .landing-nav {
            width: 100%;
            box-sizing: border-box;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .landing-nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.03em;
            color: var(--text-main);
        }

        .landing-nav .logo-icon {
            width: 30px;
            height: 30px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .nav-btn {
            padding: 10px 22px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

        .nav-btn-primary {
            border: none;
            background: var(--accent);
            color: white;
        }

        .nav-btn-primary:hover {
            background: var(--accent-hover);
            color: white;
            box-shadow: 0 8px 20px -6px var(--accent-glow);
        }

        .auth-page-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 88px);
            padding: 24px;
            box-sizing: border-box;
        }

        #loggedInView { display: none; }

        #loggedInView p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 28px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--accent);
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 8px 20px -6px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* 🌟 Google 登入按鈕樣式 */
        .google-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .google-btn:hover {
            background-color: var(--bg-input);
            border-color: var(--accent);
            box-shadow: var(--card-shadow);
            transform: translateY(-1px);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        /* 分隔線 */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .toggle-link {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 24px;
            cursor: pointer;
            display: block;
        }

        .toggle-link:hover {
            color: var(--accent);
        }

        #authError {
            color: var(--danger);
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- 🌟 首頁導覽列：首頁獨立展示原則——不管有沒有登入都會顯示，永遠不強制跳轉。
         右側按鈕由下方 <script> 依 window.authGuardReady 的登入狀態動態切換。 -->
    <nav class="landing-nav">
        <div class="logo">
            <div class="logo-icon">O</div>
            OfferDash
        </div>
        <div id="navAuthArea">
            <a href="#authForm" class="nav-btn" id="navGuestBtn">登入 / 註冊</a>
            <button class="nav-btn nav-btn-primary" id="navDashboardBtn" style="display:none;">進入控制台 →</button>
        </div>
    </nav>

    <div class="auth-page-body">
        <div class="auth-card">

            <!-- 訪客版：登入 / 註冊表單（預設顯示） -->
            <div id="guestView">
                <div class="logo-icon">O</div>
                <h2 id="formTitle" style="margin-top: 0;">登入系統</h2>
                <p id="formSubtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">存取您的 AI 面試生態系</p>

                <div class="divider">或使用 Email</div>

                <form id="authForm" onsubmit="handleAuth(event)">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" class="input-field" required placeholder="name@company.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" class="input-field" required placeholder="••••••••">
                    </div>

                    <button type="submit" id="submitBtn" class="btn">登入</button>
                    <div id="authError"></div>
                </form>

                <span class="toggle-link" id="toggleMode" onclick="toggleAuthMode()">還沒有帳號？點此註冊</span>
                <button id="googleLoginBtn" class="google-btn">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    使用 Google 帳號快速登入
                </button>
            </div>

            <!-- 已登入版：不強制跳轉，改為顯示明確的「進入控制台」入口 -->
            <div id="loggedInView">
                <div class="logo-icon">O</div>
                <h2 style="margin-top: 0;">歡迎回來</h2>
                <p id="loggedInGreeting"></p>
                <button class="btn" id="dashboardEntryBtn">進入控制台 →</button>
                <span class="toggle-link" onclick="logout()">登出並切換帳號</span>
            </div>

        </div>
    </div>

    <script>
        // 🌟 首頁 UI 動態切換：await 由 auth-guard.js 算好的登入狀態（避免重複呼叫
        // supabaseClient.auth.getSession()），依結果切換導覽列按鈕與卡片內容，
        // 全程都不會發生強制跳轉——訪客留在登入表單，已登入者看到「進入控制台」入口。
        function resolveDashboardTarget() {
            const redirect = new URLSearchParams(window.location.search).get('redirect');
            return redirect ? `pages/${redirect}` : 'pages/overview.html';
        }

        window.authGuardReady.then((state) => {
            if (!state || !state.effectivelyLoggedIn) return;

            document.getElementById('guestView').style.display = 'none';
            document.getElementById('loggedInView').style.display = 'block';
            document.getElementById('navGuestBtn').style.display = 'none';
            document.getElementById('navDashboardBtn').style.display = 'inline-block';

            const email = state.session?.user?.email || '';
            const greetingEl = document.getElementById('loggedInGreeting');
            if (greetingEl) greetingEl.innerText = email ? `已登入為 ${email}` : '您已登入';

            const target = resolveDashboardTarget();
            document.getElementById('navDashboardBtn').onclick = () => { window.location.href = target; };
            document.getElementById('dashboardEntryBtn').onclick = () => { window.location.href = target; };
        });
    </script>

</body>

</html>

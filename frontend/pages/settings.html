<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <script src="./../js/theme-init.js"></script>
    <script src="./../js/hero-image-presets.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統設定</title>
    <style>
        /* 🌟 Clean B2B / Fintech 風格（與 index.html / consultant.html 完全一致的設計變數） */
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-input: #F8FAFC;
            --border: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #475569;
            --accent: #1E3A8A;
            --accent-hover: #1E40AF;
            --accent-glow: rgba(30, 58, 138, 0.14);
            --danger: #DC2626;
            --success: #059669;
            --radius-lg: 1.25rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;

            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(226, 232, 240, 0.6);
            --overlay-bg: rgba(15, 23, 42, 0.15);
            --hover-tint: rgba(30, 58, 138, 0.06);
            --active-tint: rgba(30, 58, 138, 0.08);
            --card-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.1), 0 4px 16px rgba(15, 23, 42, 0.04);
            --sidebar-shadow: 4px 0 24px rgba(15, 23, 42, 0.05);
            --scrollbar-track: #F1F5F9;
            --scrollbar-thumb: #CBD5E1;
        }

        /* 🌙 暗色模式：由 theme-init.js 在 <html> 加上 .dark class 觸發 */
        :root.dark {
            /* 🌑 現代科技黑：主要背景改成純黑／深黑灰色系，取代原本偏藍的深 slate 色階，
               強調色（--accent 藍）保留，作為按鈕／連結／互動元素的少量亮色點綴 */
            --bg-page: #0A0A0A;
            --bg-card: #141414;
            --bg-input: #1A1A1A;
            --border: #262626;
            --text-main: #FAFAFA;
            --text-muted: #A3A3A3;
            --accent: #3B82F6;
            --accent-hover: #60A5FA;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --danger: #F87171;
            --success: #34D399;

            --glass-bg: rgba(10, 10, 10, 0.7);
            --glass-border: rgba(38, 38, 38, 0.6);
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --hover-tint: rgba(59, 130, 246, 0.12);
            --active-tint: rgba(59, 130, 246, 0.16);
            --card-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6), 0 4px 16px rgba(0, 0, 0, 0.4);
            --sidebar-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            --scrollbar-track: #0A0A0A;
            --scrollbar-thumb: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ============== App 版面骨架（與 index.html 完全一致） ============== */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 🌟 毛玻璃側邊欄 */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--sidebar-shadow);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(0);
            box-sizing: border-box;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--overlay-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 150;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #sidebarToggle:hover {
            background: var(--hover-tint) !important;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(0);
            }
            .sidebar.collapsed {
                width: 260px;
                transform: translateX(-100%);
                padding: 32px 20px;
            }
        }

        .menu-item {
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item:hover {
            background: var(--hover-tint);
            color: var(--text-main);
        }

        .menu-item.active {
            background: var(--active-tint);
            color: var(--accent);
            border-left: 4px solid var(--accent);
        }

        .menu-item-group {
            position: relative;
        }

        .menu-item-parent {
            justify-content: space-between;
        }

        .submenu-arrow {
            font-size: 10px;
            transition: transform 0.3s ease;
        }

        .menu-item-group.open .submenu-arrow,
        .menu-item-group:hover .submenu-arrow {
            transform: rotate(180deg);
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item-group.open .submenu,
        .menu-item-group:hover .submenu {
            max-height: 160px;
        }

        .submenu-item {
            padding: 10px 16px 10px 32px;
            margin-top: 4px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .submenu-item:hover {
            background: var(--hover-tint);
            color: var(--text-main);
        }

        .submenu-item.active {
            background: var(--active-tint);
            color: var(--accent);
            font-weight: 600;
        }

        .main-content {
            width: 100%;
            flex: 1;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            /* header 改成 position:fixed 後不再佔文件流空間，這裡補回等高的上邊距，
               避免內容被固定 header 蓋住 */
            padding-top: 96px;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* 🌟 Edge-to-Edge：header 固定滿版於視窗頂端（見 shared-header.js），高度統一為 72px，
           全站 8 個頁面都用同一組數值，搭配 .main-content 的 padding-top: 96px 補回空間 */
        header {
            width: 100%;
            max-width: 100%;
            height: 72px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* ============== 設定頁面核心 UI ============== */
        .settings-container {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 24px 80px;
            box-sizing: border-box;
        }

        .settings-page-header {
            margin-bottom: 32px;
        }

        .settings-page-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--text-main);
        }

        .settings-page-header p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .settings-layout {
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }

        /* 左側垂直導覽選單 */
        .settings-tabs {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-tab-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .settings-tab-item:hover {
            background: var(--hover-tint);
            color: var(--text-main);
        }

        .settings-tab-item.active {
            background: var(--bg-card);
            color: var(--accent);
            font-weight: 600;
            border-left: 4px solid var(--accent);
            box-shadow: var(--card-shadow);
        }

        .settings-tab-icon {
            flex-shrink: 0;
        }

        /* 右側白色內容卡片 */
        .settings-content-card {
            flex: 1;
            min-width: 0;
            background: var(--bg-card);
            border: none;
            box-shadow: var(--card-shadow);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-sizing: border-box;
        }

        .settings-panel {
            display: none;
            flex-direction: column;
            gap: 24px;
        }

        .settings-panel.active {
            display: flex;
        }

        .settings-panel-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .settings-panel-desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .settings-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 720px) {
            .settings-layout {
                flex-direction: column;
            }
            .settings-tabs {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
            }
            .settings-form-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 表單欄位 */
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            padding-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            font-weight: 500;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: #94A3B8;
            font-weight: 400;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Tab 2：面試官風格卡片單選 */
        .style-options {
            display: flex;
            gap: 16px;
        }

        .style-option {
            flex: 1;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .style-option:hover {
            border-color: var(--accent);
        }

        .style-option.selected {
            border-color: var(--accent);
            background: var(--hover-tint);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .style-option-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 auto 10px;
        }

        .style-option-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .style-option-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Tab 3：主題卡片單選 */
        .theme-options {
            display: flex;
            gap: 16px;
        }

        .theme-option {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: var(--bg-card);
        }

        .theme-option:hover {
            border-color: var(--accent);
        }

        .theme-option.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .theme-preview {
            height: 70px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .theme-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 18px;
        }

        .theme-preview-light {
            background: #F8FAFC;
        }
        .theme-preview-light::before {
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
        }

        .theme-preview-dark {
            background: #0A0A0A;
        }
        .theme-preview-dark::before {
            background: #141414;
            border-bottom: 1px solid #333333;
        }

        .theme-preview-system {
            background: linear-gradient(90deg, #F8FAFC 50%, #0A0A0A 50%);
        }
        .theme-preview-system::before {
            background: linear-gradient(90deg, #FFFFFF 50%, #141414 50%);
            border-bottom: 1px solid #CBD5E1;
        }

        .theme-option-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 主頁 Hero 背景圖片：預覽圖 */
        .hero-image-preview {
            position: relative;
            width: 100%;
            height: 128px; /* h-32 */
            border-radius: var(--radius-md);
            overflow: hidden;
            background-image: linear-gradient(135deg, #050505 0%, #0A0A0A 55%, #141414 100%);
            background-size: cover;
            background-position: center;
            margin-bottom: 16px;
        }

        .hero-image-preview-overlay {
            position: absolute;
            inset: 0;
            /* 深色遮罩，確保之後套上真實照片時文字/縮圖仍保有質感與可讀性 */
            background: rgba(10, 10, 10, 0.35);
        }

        .hero-image-preview-label {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin: 12px;
            padding: 4px 12px;
            background: rgba(10, 10, 10, 0.6);
            color: #FAFAFA;
            font-size: 12px;
            font-weight: 600;
            border-radius: 100px;
        }

        /* 主頁 Hero 背景圖片：預設／自訂選項 Grid */
        .hero-image-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .hero-image-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .hero-image-option:hover {
            border-color: var(--accent);
        }

        .hero-image-option.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .hero-image-option span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .hero-image-option.selected span {
            color: var(--accent);
        }

        .hero-image-thumb {
            width: 100%;
            height: 56px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
        }

        /* 三個預設縮圖：先用 CSS 漸層／圖樣代替真實照片（不引用外部圖片網址） */
        /* 三個以上的預設縮圖現在由 hero-image-presets.js 動態產生 SVG 圖片並用 inline style 套上，
           這裡只留下「上傳自訂圖片」按鈕專屬的虛線樣式 */
        .hero-image-option--upload {
            border-style: dashed;
        }

        .hero-image-thumb--upload {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-input);
            color: var(--text-muted);
        }

        .hero-image-hint {
            margin: 12px 0 0 0;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        @media (max-width: 560px) {
            .hero-image-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 按鈕 */
        .settings-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: none;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Toast 提示：固定使用深色底＋白字的「反色」浮動卡片，不隨主題翻轉，
           避免在暗色模式下 var(--text-main) 變成近白色時，白字疊在近白底上看不見 */
        .settings-toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: #141414;
            color: #FAFAFA;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .settings-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .settings-toast .toast-icon {
            color: #34D399;
            font-size: 16px;
        }

        /* ============== 頁尾 Contact Us（橫軸版，與 index.html 完全一致） ============== */
        .site-footer {
            width: 100%;
            border-top: 1px solid var(--border);
            background: transparent;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1024px;
            margin: 0 auto;
            padding: 48px 24px 24px;
            box-sizing: border-box;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 48px;
            flex-wrap: wrap;
        }

        .footer-brand {
            flex: 1;
            min-width: 220px;
        }

        .footer-brand p {
            margin: 12px 0 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            max-width: 320px;
        }

        .footer-contact {
            flex: 1.4;
            min-width: 280px;
        }

        .footer-contact h3 {
            margin: 0 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .footer-contact-item {
            display: flex;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a.footer-contact-item:hover {
            color: var(--accent);
        }

        .footer-contact-label {
            min-width: 52px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-top: 2px;
        }

        .footer-social {
            display: flex;
            gap: 16px;
        }

        .footer-social a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .footer-social a:hover {
            color: var(--accent);
        }

        .footer-bottom {
            max-width: 1024px;
            margin: 0 auto;
            padding: 16px 24px 32px;
            box-sizing: border-box;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .footer-inner {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="app-layout">

        <div id="appSidebar" data-active="settings"></div>
        <script src="./../js/shared-sidebar.js"></script>

        <div class="main-content">

            <div id="appHeader"></div>
            <script src="./../js/shared-header.js"></script>

            <div class="settings-container">
                <div class="settings-page-header">
                    <h1>系統設定</h1>
                    <p>管理您的帳號、面試偏好與介面體驗</p>
                </div>

                <div class="settings-layout">
                    <div class="settings-tabs">
                        <div class="settings-tab-item active" data-tab="profile" onclick="switchSettingsTab('profile')">
                            <svg class="settings-tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
                            個人資料與帳號
                        </div>
                        <div class="settings-tab-item" data-tab="preferences" onclick="switchSettingsTab('preferences')">
                            <svg class="settings-tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor"></circle></svg>
                            面試偏好設定
                        </div>
                        <div class="settings-tab-item" data-tab="appearance" onclick="switchSettingsTab('appearance')">
                            <svg class="settings-tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><line x1="8" y1="20" x2="16" y2="20"></line><line x1="12" y1="16" x2="12" y2="20"></line></svg>
                            外觀與系統體驗
                        </div>
                    </div>

                    <div class="settings-content-card">

                        <!-- Tab 1：個人資料與帳號 -->
                        <div class="settings-panel active" id="panel-profile">
                            <div>
                                <h2 class="settings-panel-title">個人資料與帳號</h2>
                                <p class="settings-panel-desc">更新您的顯示名稱與聯絡信箱</p>
                            </div>

                            <div class="settings-form-grid">
                                <div class="input-group">
                                    <label>顯示名稱</label>
                                    <input type="text" id="settingDisplayName" class="input-field" placeholder="例如：王小明">
                                </div>
                                <div class="input-group">
                                    <label>聯絡信箱</label>
                                    <input type="email" id="settingEmail" class="input-field" placeholder="you@example.com">
                                </div>
                            </div>

                            <div class="settings-actions">
                                <button class="btn btn-primary" onclick="saveProfileSettings()">儲存設定</button>
                            </div>
                        </div>

                        <!-- Tab 2：面試偏好設定 -->
                        <div class="settings-panel" id="panel-preferences">
                            <div>
                                <h2 class="settings-panel-title">面試偏好設定</h2>
                                <p class="settings-panel-desc">客製化 AI 面試官的風格與預設練習條件</p>
                            </div>

                            

                            <div class="settings-form-grid">
                                <div class="input-group">
                                    <label>預設目標職位</label>
                                    <input type="text" id="settingDefaultJobTitle" class="input-field" placeholder="例如：前端工程師 Frontend Engineer">
                                </div>
                                <div class="input-group">
                                    <label>預設應徵公司／產業</label>
                                    <input type="text" id="settingDefaultCompany" class="input-field" placeholder="例如：Google">
                                </div>
                            </div>

                            <div class="settings-form-grid">
                                <div class="input-group">
                                    <label>預設面試類型</label>
                                    <select id="settingDefaultInterviewType" class="input-field">
                                        <option value="job">職場面試</option>
                                        <option value="academic">升學面試</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label>預設面試難度</label>
                                    <select id="settingDefaultDifficulty" class="input-field">
                                        <option value="easy">初級 (Basic)</option>
                                        <option value="medium">中級 (Medium)</option>
                                        <option value="hard">高級 (Hard)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="settings-form-grid">
                                <div class="input-group">
                                    <label>預設面試回合數</label>
                                    <input type="number" id="settingDefaultRounds" class="input-field" min="1" max="20" placeholder="例如：5">
                                </div>
                                <div class="input-group">
                                    <label>預設語系</label>
                                    <select id="settingDefaultLocale" class="input-field">
                                        <option value="zh">繁體中文</option>
                                        <option value="en">English</option>
                                    </select>
                                </div>
                            </div>

                            <div class="settings-actions">
                                <button class="btn btn-primary" onclick="saveInterviewPreferences()">儲存設定</button>
                            </div>
                        </div>

                        <!-- Tab 3：外觀與系統體驗 -->
                        <div class="settings-panel" id="panel-appearance">
                            <div>
                                <h2 class="settings-panel-title">外觀與系統體驗</h2>
                                <p class="settings-panel-desc">選擇你偏好的介面主題，點擊即可即時預覽全站深淺色</p>
                            </div>

                            <div class="input-group">
                                <label>主題</label>
                                <div class="theme-options">
                                    <div class="theme-option" data-value="light" onclick="selectTheme('light')">
                                        <div class="theme-preview theme-preview-light"></div>
                                        <div class="theme-option-title">Light</div>
                                    </div>
                                    <div class="theme-option" data-value="dark" onclick="selectTheme('dark')">
                                        <div class="theme-preview theme-preview-dark"></div>
                                        <div class="theme-option-title">Dark</div>
                                    </div>
                                    <div class="theme-option" data-value="system" onclick="selectTheme('system')">
                                        <div class="theme-preview theme-preview-system"></div>
                                        <div class="theme-option-title">System</div>
                                    </div>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>主頁視覺風格 (Dashboard Hero Image)</label>

                                <!-- 當前預覽圖 -->
                                <div class="hero-image-preview" id="heroImagePreview">
                                    <div class="hero-image-preview-overlay"></div>
                                    <span class="hero-image-preview-label">目前套用中</span>
                                </div>

                                <!-- 預設與自訂選項：由 settings.js 依 HERO_IMAGE_PRESET_DEFS（frontend/js/hero-image-presets.js）動態產生 -->
                                <div class="hero-image-options" id="heroImageOptionsGrid"></div>
                                <input type="file" id="heroImageUploadInput" accept="image/*" hidden onchange="handleHeroImageUpload(event)">
                                <p class="hero-image-hint">建議上傳寬版橫式圖片，檔案大小請控制在 2MB 以內（圖片會存在瀏覽器本機，不會上傳到伺服器）</p>
                            </div>

                            
                        </div>

                    </div>
                </div>
            </div>

            <div id="appFooter"></div>
            <script src="./../js/shared-footer.js"></script>
        </div>
    </div>

    <div id="settingsToast" class="settings-toast"></div>

    <!-- 載入 Supabase SDK 與共用登入邏輯 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./../js/auth.js"></script>
    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar) return;
            sidebar.classList.toggle('collapsed');
            const isOpen = !sidebar.classList.contains('collapsed');
            if (overlay) overlay.classList.toggle('hidden', !isOpen);
        }

        // 智慧區塊切換與路由邏輯：本頁是獨立頁面，其餘功能一律跳轉過去
        function switchFeature(featureName) {
            const BASE_PATH = '';

            if (featureName === 'interview' || featureName === 'jd') {
                window.location.href = `${BASE_PATH}/index.html?feature=${featureName}`;
                return;
            }
            if (featureName === 'dashboard') {
                window.location.href = `${BASE_PATH}/frontend/pages/dashboard.html`;
                return;
            }
            if (featureName === 'resume-records') {
                window.location.href = `${BASE_PATH}/frontend/pages/resume_records.html`;
                return;
            }
            if (featureName === 'consultant') {
                window.location.href = `${BASE_PATH}/frontend/pages/consultant.html`;
                return;
            }
            if (featureName === 'calendar') {
                window.location.href = `${BASE_PATH}/frontend/pages/calendar.html`;
                return;
            }

            // featureName === 'settings'：已經在本頁，只需收合側邊欄
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar && !sidebar.classList.contains('collapsed')) sidebar.classList.add('collapsed');
            if (overlay && !overlay.classList.contains('hidden')) overlay.classList.add('hidden');
        }

        function escapeHtml(value = "") {
            return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
    <script src="./../js/settings.js"></script>
</body>

</html>
